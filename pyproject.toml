[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qf-solver"
version = "0.2.0a0"
description = "Solveur elements finis MITC4, TET4 et TET10 avec audit boite blanche."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Quentin Farinazzo" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
keywords = ["finite-element", "mechanics", "mitc4", "tetrahedron", "white-box-audit"]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7"
]

[project.urls]
Homepage = "https://github.com/emptiesvoid-cloud/QF_solver"
Source = "https://github.com/emptiesvoid-cloud/QF_solver"
Issues = "https://github.com/emptiesvoid-cloud/QF_solver/issues"

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=6.2",
  "tomli>=2.0; python_version < '3.11'",
  "h5py>=3.10",
  "PyYAML>=6.0"
]
dev = [
  "pytest>=8",
  "pytest-cov>=6.2",
  "tomli>=2.0; python_version < '3.11'",
  "coverage>=7.9",
  "h5py>=3.10",
  "ruff>=0.6",
  "mypy>=1.16",
  "hypothesis>=6.135",
  "PyYAML>=6.0"
]
large = [
  "h5py>=3.10",
  "mpi4py>=3.1",
  "petsc4py>=3.20"
]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.6",
  "playwright==1.61.0",
  "gmsh==4.15.2",
  "reportlab==4.4.9",
  "svglib==2.0.2",
  "pypdf==6.10.0",
  "platformdirs==4.9.4"
]
mesh = [
  "gmsh==4.15.2"
]

[project.scripts]
qf-solver = "solveur.cli.main:main"
solveur-ef = "solveur.cli.main:legacy_main"
mitc4-solver = "mitc4.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["solveur*", "mitc4*"]

[tool.setuptools.data-files]
examples = ["examples/*.json"]
qualification = [
  "qualification/benchmarks.json",
  "qualification/campaign.json",
  "qualification/demonstrations.json",
  "qualification/formulas.json",
  "qualification/requirements.json"
]
requirements = ["requirements/baseline-standard.txt", "requirements/baseline-large-linux.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "large: optional large-scale tests for manually generated big models",
  "docs: documentation site and browser checks requiring optional dependencies",
  "benchmark: controlled meshed mechanical benchmark campaign requiring Gmsh",
  "evidence: checks requiring the optional controlled V&V evidence corpus"
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["solveur", "mitc4"]
omit = [
  "src/solveur/benchmarks/*",
  "src/solveur/documentation/*",
  "src/solveur/verification/*",
]

[tool.coverage.report]
fail_under = 84
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
