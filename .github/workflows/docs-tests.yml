name: Documentation tests

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "tests/documentation/**"
      - "scripts/docs_publication.py"
      - ".github/workflows/docs-tests.yml"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs-tests:
    environment: qf-fem-ci-approval
    runs-on: ubuntu-latest

    steps:
      # Reject outside the single approved PR attempt before checking out code.
      - name: Reject outside the PR 132 approval scope
        if: >-
          github.event_name != 'pull_request' ||
          github.event.number != 132 ||
          github.repository != 'emptiesvoid-cloud/QF_solver' ||
          github.event.pull_request.head.repo.full_name != github.repository ||
          github.event.pull_request.head.ref != 'docs/post-release-0212-consistency' ||
          github.event.pull_request.base.ref != 'main' ||
          github.run_attempt != 1
        shell: bash
        run: |
          echo "::error::This CI activation candidate permits only attempt 1 of PR 132."
          exit 1
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify approved pull request identity
        env:
          QF_APPROVED_IDENTITY_MANIFEST_JSON: ${{ secrets.QF_CI_DOCS_MANIFEST_JSON }}
          QF_MANIFEST_AUTH_SECRET: ${{ secrets.QF_CI_DOCS_MANIFEST_AUTH_SECRET }}
          QF_MANIFEST_SIGNATURE: ${{ secrets.QF_CI_DOCS_MANIFEST_SIGNATURE }}
        run: python -B scripts/ci_verify_pr_identity.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,dev,docs]"

      - name: Run documentation tests
        env:
          QF_APPROVED_IDENTITY_MANIFEST_JSON: ${{ secrets.QF_CI_DOCS_MANIFEST_JSON }}
          QF_MANIFEST_AUTH_SECRET: ${{ secrets.QF_CI_DOCS_MANIFEST_AUTH_SECRET }}
          QF_MANIFEST_SIGNATURE: ${{ secrets.QF_CI_DOCS_MANIFEST_SIGNATURE }}
        run: |
          python -B scripts/ci_run_bounded_step.py --profile docs-tests -- -m pytest tests/documentation/test_docs_generation.py -q

      - name: MkDocs strict build
        run: mkdocs build --strict -f .github/pages/mkdocs.yml

      - name: Run packaging tests
        env:
          QF_APPROVED_IDENTITY_MANIFEST_JSON: ${{ secrets.QF_CI_DOCS_MANIFEST_JSON }}
          QF_MANIFEST_AUTH_SECRET: ${{ secrets.QF_CI_DOCS_MANIFEST_AUTH_SECRET }}
          QF_MANIFEST_SIGNATURE: ${{ secrets.QF_CI_DOCS_MANIFEST_SIGNATURE }}
        run: |
          python -B scripts/ci_run_bounded_step.py --profile docs-packaging -- -m pytest tests/integration/test_packaging.py -q
