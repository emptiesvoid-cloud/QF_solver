name: Documentation tests

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "tests/documentation/**"
      - "scripts/docs_publication.py"
      - ".github/workflows/docs-tests.yml"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs-tests:
    environment: qf-fem-ci-approval
    runs-on: ubuntu-latest

    steps:
      # Fail closed until a reviewed hard-limit supervisor and identity binding exist.
      - name: Hold pending CI execution controls
        shell: bash
        run: |
          echo "::error::CI numerical execution is blocked: hard limits and identity binding are not approved."
          exit 1
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,dev,docs]"

      - name: Run documentation tests
        run: |
          python -m pytest tests/documentation/test_docs_generation.py -q

      - name: MkDocs strict build
        run: mkdocs build --strict -f .github/pages/mkdocs.yml

      - name: Run packaging tests
        run: |
          python -m pytest tests/integration/test_packaging.py -q
