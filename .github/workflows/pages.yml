name: Deploy QF Solver docs

on:
  workflow_dispatch:
    inputs:
      deploy_public_site:
        description: Deploy docs after build; requires the separately configured github-pages reviewer rule
        type: boolean
        required: true
        default: false
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/pages/mkdocs.yml"
      - ".github/workflows/pages.yml"
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs mkdocs-material

      - name: Build documentation
        run: mkdocs build -f .github/pages/mkdocs.yml

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_public_site && needs.build.result == 'success' }}
    permissions:
      pages: write
      id-token: write
    # Configure required reviewers and disable bypass on the repository environment before deployment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
