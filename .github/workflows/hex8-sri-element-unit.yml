name: HEX8-SRI element unit checks

on:
  pull_request:
    branches: [emptiesvoids-cloud/0.2.12]
    paths:
      - ".github/workflows/hex8-sri-element-unit.yml"
      - "src/solveur/elements/solid/hex8.py"
      - "src/solveur/elements/solid/hex8_sri.py"
      - "tests/unit/test_hex8_sri_element.py"

permissions:
  contents: read

jobs:
  element-unit:
    name: HEX8-SRI element unit / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install controlled baseline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/baseline-standard.txt
          python -m pip install -e . --no-deps
      - name: Ruff
        run: python -m ruff check src/solveur/elements/solid/hex8.py src/solveur/elements/solid/hex8_sri.py tests/unit/test_hex8_sri_element.py
      - name: Affine patch
        run: python -m pytest -q tests/unit/test_hex8_sri_element.py::test_sri_affine_field_has_constant_strain_at_all_integration_points
      - name: Exact volumetric integration
        run: python -m pytest -q tests/unit/test_hex8_sri_element.py::test_sri_volumetric_weight_matches_analytic_and_standard_hex8_energy
      - name: Constitutive stability
        run: python -m pytest -q tests/unit/test_hex8_sri_element.py::test_sri_constitutive_split_remains_stable_near_incompressibility
      - name: Element invariants
        run: python -m pytest -q tests/unit/test_hex8_sri_element.py::test_sri_stiffness_has_six_rigid_modes_and_balanced_internal_force
      - name: Central Jacobian guard
        run: python -m pytest -q tests/unit/test_hex8_sri_element.py::test_sri_rejects_negative_central_jacobian_missed_by_full_rule
      - name: Finite geometry guard
        run: python -m pytest -q tests/unit/test_hex8_sri_element.py::test_sri_rejects_nonfinite_geometry_coordinates
      - name: Scale-relative geometry guard
        run: python -m pytest -q tests/unit/test_hex8_sri_element.py::test_hex8_and_sri_geometry_validation_scales_with_element_size
      - name: Standard HEX8 finite geometry guard
        run: python -m pytest -q tests/unit/test_hex8_sri_element.py::test_standard_hex8_rejects_nonfinite_geometry_coordinates
      - name: Compile changed Python files
        run: python -m py_compile src/solveur/elements/solid/hex8.py src/solveur/elements/solid/hex8_sri.py tests/unit/test_hex8_sri_element.py
