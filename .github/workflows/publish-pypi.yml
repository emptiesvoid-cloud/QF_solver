name: Publish Python package

# PyPI is a selected wheel/sdist channel. This workflow never publishes the
# GitHub repository archive, GitHub Release, or a Zenodo deposit.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Annotated source tag to build (a source-only tag will fail metadata preflight)"
        required: true
        type: string
        default: v0.2.9
      contract_path:
        description: "Prospectively committed frozen package/public-docs contract"
        required: true
        type: string
        default: qualification/0_2_9/wp14/wp14_v0_2_9_tagged_package_contract.json
      confirm_publish:
        description: "Publish the audited wheel and sdist to PyPI after all gates pass"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    name: Tagged public metadata preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          path: tagged-source
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify immutable tag and public release copy
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git -C tagged-source cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git -C tagged-source rev-parse HEAD)" = "$(git -C tagged-source rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          python scripts/check_publication_metadata.py --root tagged-source --tag "$RELEASE_TAG"

  quality:
    name: Tagged release quality gate
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked standard baseline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/baseline-standard.txt
          python -m pip install -e . --no-deps
      - name: Run engineering verification gate
        run: python qf_solver.py verify-all --profile engineering

  build:
    name: Frozen selected package and public-docs audit
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      release_verified: ${{ steps.verify_release.outputs.release_verified }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Bind frozen contract to the requested tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONTRACT_PATH: ${{ inputs.contract_path }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          source_sha="$(python -c 'import json, os; print(json.load(open(os.environ["CONTRACT_PATH"], encoding="utf-8"))["source_sha"])')"
          test "$source_sha" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Install candidate verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/baseline-standard.txt
          python -m pip install build wheel twine
      - name: Audit the frozen public documentation surface
        env:
          CONTRACT_PATH: ${{ inputs.contract_path }}
        run: |
          python scripts/audit_wp14_public_scope.py \
            --contract "$CONTRACT_PATH" \
            --output "$RUNNER_TEMP/qf-public-scope.json"
      - name: Rebuild and probe selected wheel and sdist
        env:
          CONTRACT_PATH: ${{ inputs.contract_path }}
        run: |
          python scripts/verify_public_package.py \
            --contract "$CONTRACT_PATH" \
            --output "$RUNNER_TEMP/qf-package-candidate"
          python -m twine check "$RUNNER_TEMP"/qf-package-candidate/dist/*
          python scripts/check_distribution.py "$RUNNER_TEMP"/qf-package-candidate/dist/*
      - name: Confirm only verified candidate bytes are uploaded
        id: verify_release
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          candidate = Path(os.environ["RUNNER_TEMP"]) / "qf-package-candidate"
          result = json.loads((candidate / "result.json").read_text(encoding="utf-8"))
          scope = json.loads((Path(os.environ["RUNNER_TEMP"]) / "qf-public-scope.json").read_text(encoding="utf-8"))
          if result["status"] != "PASS_CANDIDATE_PACKAGE_ONLY" or scope["status"] != "PASS_BOUNDED_PUBLIC_SURFACES":
              raise SystemExit("The selected package and documentation gates must both pass")
          expected = {item["path"]: item["sha256"] for item in result["package_check"]["binaries"]}
          actual = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in (candidate / "dist").iterdir()}
          if actual != expected or len(actual) != 2:
              raise SystemExit("Distribution bytes differ from the frozen candidate report")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("release_verified=true\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: ${{ runner.temp }}/qf-package-candidate/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bounded-package-audit
          path: |
            ${{ runner.temp }}/qf-public-scope.json
            ${{ runner.temp }}/qf-package-candidate/result.json
            ${{ runner.temp }}/qf-package-candidate/package_check.json
            ${{ runner.temp }}/qf-package-candidate/manifest.json
          if-no-files-found: error

  publish:
    needs: [preflight, quality, build]
    if: >-
      needs.preflight.result == 'success' &&
      needs.quality.result == 'success' &&
      needs.build.result == 'success' &&
      needs.build.outputs.release_verified == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_publish == true
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qf-solver
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
