name: Publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Confirm the intentional PyPI publication"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked standard baseline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/baseline-standard.txt
          python -m pip install -e . --no-deps
      - name: Run engineering verification gate
        run: python qf_solver.py verify-all --profile engineering

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          from packaging.version import Version
          import os

          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v"):
              raise SystemExit(f"Invalid release tag: {tag}")
          package_version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          if Version(tag[1:]) != Version(package_version):
              raise SystemExit(
                  f"Tag {tag} does not match package version {package_version}"
              )
          print(f"Release tag {tag} matches qf-solver {package_version}")
          PY
      - name: Verify distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
          python scripts/check_distribution.py dist/*
      - name: Smoke-test the built wheel
        run: |
          python -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          qf-solver --version
          qf-solver methods
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.confirm_publish == true)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qf-solver
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
