name: Publish Python package

# PyPI is a selected wheel/sdist channel. This workflow never publishes the
# GitHub repository archive, GitHub Release, or a Zenodo deposit.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Annotated source tag to build (a source-only tag will fail metadata preflight)"
        required: true
        type: string
      contract_path:
        description: "Prospectively committed frozen package/public-docs contract"
        required: true
        type: string
      confirm_publish:
        description: "Publish the audited wheel and sdist to PyPI after all gates pass"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    name: Tagged public metadata preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          path: tagged-source
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify immutable tag and public release copy
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
          CONTRACT_PATH: ${{ inputs.contract_path }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$CONFIRM_PUBLISH" == "true" ]]; then
            for artifact_kind in wheel sdist; do
              artifact_hash="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["audited_artifacts"][sys.argv[2]]["sha256"])' "$CONTRACT_PATH" "$artifact_kind")"
              [[ "$artifact_hash" =~ ^[0-9a-f]{64}$ ]]
            done
          fi
          test "$(git -C tagged-source cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git -C tagged-source rev-parse HEAD)" = "$(git -C tagged-source rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG^{commit}" HEAD
          python - "$CONTRACT_PATH" "$RELEASE_TAG" "$(git -C tagged-source rev-parse "refs/tags/$RELEASE_TAG^{commit}")" <<'PY'
          import json
          import sys

          contract = json.load(open(sys.argv[1], encoding="utf-8"))
          if contract.get("status") != "OWNER_AUTHORIZED_SELECTED_PACKAGE_RELEASE":
              raise SystemExit("The release contract is not Owner-authorized.")
          if contract.get("release_tag") != sys.argv[2] or contract.get("source_sha") != sys.argv[3]:
              raise SystemExit("The requested tag differs from the exact audited package source.")
          if contract.get("g03_status") != "FAIL_PRESERVED" or contract.get("whole_repository_archive_cleared") is not False:
              raise SystemExit("G03 must remain failed and the complete repository archive uncleared.")
          if contract.get("wp14_status") != "HOLD_NOT_PROMOTED":
              raise SystemExit("This release workflow does not authorize a WP14 status change.")
          PY
          python scripts/check_publication_metadata.py --root tagged-source --tag "$RELEASE_TAG"

  quality:
    name: Tagged release quality gate
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked standard baseline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/baseline-standard.txt
          python -m pip install -e . --no-deps
      - name: Fetch frozen WP04-C and WP04-F source revisions
        run: |
          git fetch --no-tags origin 0c7ecfaee74c1f0bb362afb1f0ac8bc45686c0ba
          git cat-file -e 0c7ecfaee74c1f0bb362afb1f0ac8bc45686c0ba:qualification/0_2_9/wp04f/wp04_final_closure_audit.json
          git cat-file -e 0c7ecfaee74c1f0bb362afb1f0ac8bc45686c0ba:qualification/0_2_9/wp04_c_tet4_campaign.json
          git cat-file -e 0c7ecfaee74c1f0bb362afb1f0ac8bc45686c0ba:qualification/0_2_9/wp04_c_tet4_structural_summary.json
          git fetch --no-tags origin 70e1bf953c8e6f37b8070e78ca97e58b21499291
          git cat-file -e 70e1bf953c8e6f37b8070e78ca97e58b21499291:src/solveur/core/analyses/geometric_nonlinear.py
      - name: Download and verify recovered evidence archive
        run: |
          archive="$RUNNER_TEMP/wp14-r23-engineering-source-evidence.zip"
          curl --fail --location --retry 3 \
            "https://drive.google.com/uc?export=download&id=1ly_pVCeeyW7MfsHxgBKjL3DM0UeHawv9" \
            --output "$archive"
          python scripts/prepare_wp14_recovered_evidence.py \
            --archive "$archive" \
            --archive-root "$RUNNER_TEMP/qf_solver_evidence_archive"
          echo "QF_SOLVER_EVIDENCE_ARCHIVE_ROOT=$RUNNER_TEMP/qf_solver_evidence_archive" >> "$GITHUB_ENV"
      - name: Full MITC4 benchmarks
        run: python qf_solver.py verify
      - name: Run engineering verification gate
        env:
          QF_SOLVER_RUN_RECOVERED_EVIDENCE: "1"
        run: python qf_solver.py verify-all --profile engineering

  docs:
    name: Tagged documentation and package checks
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,dev,docs]"
      - name: Run documentation tests
        run: python -m pytest tests/documentation/test_docs_generation.py -q
      - name: Build public documentation strictly
        run: mkdocs build --strict -f .github/pages/mkdocs.yml
      - name: Run packaging tests
        run: python -m pytest tests/integration/test_packaging.py -q

  build:
    name: Frozen selected package and public-docs audit
    needs: [quality, docs]
    runs-on: ubuntu-latest
    outputs:
      release_verified: ${{ steps.verify_release.outputs.release_verified }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Bind frozen contract to the requested tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONTRACT_PATH: ${{ inputs.contract_path }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG^{commit}" HEAD
          source_sha="$(python -c 'import json, os; print(json.load(open(os.environ["CONTRACT_PATH"], encoding="utf-8"))["source_sha"])')"
          test "$source_sha" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Install candidate verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/baseline-standard.txt
          python -m pip install twine
      - name: Download uploaded selected release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qf-release-assets"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/qf-release-assets"
      - name: Audit the frozen public documentation surface
        env:
          CONTRACT_PATH: ${{ inputs.contract_path }}
        run: |
          SOURCE_CONTRACT_PATH="$(python -c 'import json, os; print(json.load(open(os.environ["CONTRACT_PATH"], encoding="utf-8"))["source_contract"]["path"])')"
          python scripts/audit_wp14_public_scope.py \
            --contract "$SOURCE_CONTRACT_PATH" \
            --output "$RUNNER_TEMP/qf-public-scope.json"
      - name: Verify exact prebuilt wheel, sdist and checksum manifest
        id: verify_release
        env:
          CONTRACT_PATH: ${{ inputs.contract_path }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          SOURCE_CONTRACT_PATH="$(python -c 'import json, os; print(json.load(open(os.environ["CONTRACT_PATH"], encoding="utf-8"))["source_contract"]["path"])')"
          python scripts/verify_authorized_release_artifacts.py \
            --contract "$CONTRACT_PATH" \
            --source-contract "$SOURCE_CONTRACT_PATH" \
            --dist "$RUNNER_TEMP/qf-release-assets" \
            --output "$RUNNER_TEMP/qf-package-candidate"
          python - "$RUNNER_TEMP/qf-package-candidate/result.json" <<'PY'
          import json
          import os
          import sys

          result = json.load(open(sys.argv[1], encoding="utf-8"))
          if result["status"] != "PASS_AUTHORIZED_SELECTED_ARTIFACTS_ONLY":
              raise SystemExit("The exact selected release assets did not pass their frozen audit.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("release_verified=true\n")
          PY
      - name: Confirm only the two audited packages enter the PyPI artifact
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          candidate = Path(os.environ["RUNNER_TEMP"]) / "qf-package-candidate"
          result = json.loads((candidate / "result.json").read_text(encoding="utf-8"))
          scope = json.loads((Path(os.environ["RUNNER_TEMP"]) / "qf-public-scope.json").read_text(encoding="utf-8"))
          if result["status"] != "PASS_AUTHORIZED_SELECTED_ARTIFACTS_ONLY" or scope["status"] != "PASS_BOUNDED_PUBLIC_SURFACES":
              raise SystemExit("The selected package and documentation gates must both pass.")
          actual = {path.name for path in (candidate / "dist").iterdir()}
          expected = {result["package_check"]["wheel"], result["package_check"]["sdist"]}
          if actual != expected:
              raise SystemExit("Only the two exact audited package files may enter the PyPI artifact.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: ${{ runner.temp }}/qf-package-candidate/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bounded-package-audit
          path: |
            ${{ runner.temp }}/qf-public-scope.json
            ${{ runner.temp }}/qf-package-candidate/package_check.json
            ${{ runner.temp }}/qf-package-candidate/asset_check.json
            ${{ runner.temp }}/qf-package-candidate/result.json
            ${{ runner.temp }}/qf-package-candidate/manifest.json
          if-no-files-found: error

  publish:
    needs: [preflight, quality, docs, build]
    if: >-
      needs.preflight.result == 'success' &&
      needs.quality.result == 'success' &&
      needs.docs.result == 'success' &&
      needs.build.result == 'success' &&
      needs.build.outputs.release_verified == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm_publish == true
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qf-solver
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
