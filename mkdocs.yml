site_name: QF_solver - Manuel technique
site_description: Documentation mecanique, numerique et de verification du solveur elements finis boite blanche.
site_author: QF_solver project
site_url: ""
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true
exclude_docs: |
  generated/**
  assets/vendor/README.md

theme:
  name: material
  custom_dir: docs/overrides
  language: fr
  font: false
  logo: assets/images/solver-mark.svg
  favicon: assets/images/solver-mark.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
  palette:
    scheme: solver-light
    primary: custom
    accent: custom

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/engineering.css

extra_javascript:
  - assets/javascripts/mathjax-config.js
  - assets/vendor/mathjax/tex-svg-full.js

extra:
  generator: false
  social: []

copyright: Documentation technique locale - aucune revendication de certification externe

