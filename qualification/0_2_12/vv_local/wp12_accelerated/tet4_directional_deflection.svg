<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-labelledby="title desc">
  <title id="title">TET4 flexion development observations</title>
  <desc id="desc">Absolute mean loaded-face vertical displacement magnitudes for H3, W1, and W2, with a one-dimensional beam diagnostic shown for context.</desc>
  <rect width="860" height="470" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">TET4 cantilever flexion — development observations</text>
  <text x="430" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">Absolute mean loaded-face UZ magnitude; not a convergence or qualification plot</text>
  <line x1="105" y1="365" x2="790" y2="365" stroke="#374151" stroke-width="1.5"/>
  <line x1="105" y1="90" x2="105" y2="365" stroke="#374151" stroke-width="1.5"/>
  <g font-family="Arial, sans-serif" font-size="12" fill="#374151">
    <line x1="100" y1="365" x2="790" y2="365" stroke="#d1d5db"/><text x="91" y="369" text-anchor="end">0</text>
    <line x1="100" y1="296.25" x2="790" y2="296.25" stroke="#e5e7eb"/><text x="91" y="300.25" text-anchor="end">40</text>
    <line x1="100" y1="227.5" x2="790" y2="227.5" stroke="#e5e7eb"/><text x="91" y="231.5" text-anchor="end">80</text>
    <line x1="100" y1="158.75" x2="790" y2="158.75" stroke="#e5e7eb"/><text x="91" y="162.75" text-anchor="end">120</text>
    <line x1="100" y1="90" x2="790" y2="90" stroke="#e5e7eb"/><text x="91" y="94" text-anchor="end">160</text>
  </g>
  <text x="29" y="228" transform="rotate(-90 29 228)" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#172033">|mean loaded-face UZ| (nm)</text>
  <line x1="105" y1="117.55" x2="790" y2="117.55" stroke="#b45309" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="782" y="108" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#92400e">1D beam diagnostic 143.97 nm</text>
  <g font-family="Arial, sans-serif" font-size="13" fill="#172033" text-anchor="middle">
    <rect x="205" y="282.57" width="100" height="82.43" rx="4" fill="#2563eb"/><text x="255" y="386">H3 · 8×4×4</text><text x="255" y="270">47.96 nm</text>
    <rect x="410" y="215.66" width="100" height="149.34" rx="4" fill="#0f766e"/><text x="460" y="386">W1 · 16×4×4</text><text x="460" y="203">86.91 nm</text>
    <rect x="615" y="278.98" width="100" height="86.02" rx="4" fill="#7c3aed"/><text x="665" y="386">W2 · 8×8×8</text><text x="665" y="266">50.01 nm</text>
  </g>
  <text x="430" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">W1 vs H3: +81.23% deflection; element quality also improves. W2 vs H3: +4.29%; all W2 tets are below the existing quality threshold.</text>
  <text x="430" y="449" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Beam formula is a diagnostic only. No asymptotic convergence or independent 3D validation is claimed.</text>
</svg>
