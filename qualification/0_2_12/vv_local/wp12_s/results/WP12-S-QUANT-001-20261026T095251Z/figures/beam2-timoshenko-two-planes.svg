<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:22px;font-weight:bold}.label{font-size:13px}.small{font-size:11px}.axis{stroke:#3d4d5c;stroke-width:1}.grid{stroke:#d8dee5;stroke-width:1}.blue{stroke:#1677b8;fill:#1677b8}.orange{stroke:#e28a18;fill:#e28a18}.red{stroke:#bb3333;fill:#bb3333}.green{stroke:#17834a;fill:#17834a}</style>
<title>BEAM2 — one-element Timoshenko comparison</title>
<desc>Relative displacement and rotation errors for two principal bending planes of one straight uniform BEAM2 cantilever. This is not a mesh-convergence or 3-D validation study.</desc>
<text class="title" x="24" y="34">BEAM2 — one-element Timoshenko comparison</text>
<line class="grid" x1="105.0" y1="300.00" x2="770.0" y2="300.00"/>
<text class="small" x="95.00" y="304.00" text-anchor="end">0.0e+00</text>
<line class="grid" x1="105.0" y1="250.00" x2="770.0" y2="250.00"/>
<text class="small" x="95.00" y="254.00" text-anchor="end">1.8e-16</text>
<line class="grid" x1="105.0" y1="200.00" x2="770.0" y2="200.00"/>
<text class="small" x="95.00" y="204.00" text-anchor="end">3.5e-16</text>
<line class="grid" x1="105.0" y1="150.00" x2="770.0" y2="150.00"/>
<text class="small" x="95.00" y="154.00" text-anchor="end">5.3e-16</text>
<line class="grid" x1="105.0" y1="100.00" x2="770.0" y2="100.00"/>
<text class="small" x="95.00" y="104.00" text-anchor="end">7.1e-16</text>
<circle class="blue" cx="265.00" cy="126.09" r="7.00"/>
<text class="small" x="265.00" y="114.09" text-anchor="middle">6.14e-16</text>
<circle class="orange" cx="315.00" cy="145.30" r="7.00"/>
<text class="small" x="315.00" y="133.30" text-anchor="middle">5.46e-16</text>
<text class="label" x="290.00" y="325.00" text-anchor="middle">UY/RZ</text>
<circle class="blue" cx="565.00" cy="145.37" r="7.00"/>
<text class="small" x="565.00" y="133.37" text-anchor="middle">5.46e-16</text>
<circle class="orange" cx="615.00" cy="145.30" r="7.00"/>
<text class="small" x="615.00" y="133.30" text-anchor="middle">5.46e-16</text>
<text class="label" x="590.00" y="325.00" text-anchor="middle">UZ/RY</text>
<line class="axis" x1="105.0" y1="300.0" x2="770.0" y2="300.0"/>
<line class="axis" x1="105.0" y1="100.0" x2="105.0" y2="300.0"/>
<circle class="blue" cx="260.00" cy="360.00" r="5.00"/>
<text class="small" x="273.00" y="364.00" text-anchor="start">Displacement relative error</text>
<circle class="orange" cx="475.00" cy="360.00" r="5.00"/>
<text class="small" x="488.00" y="364.00" text-anchor="start">Rotation relative error</text>
<text class="small" x="420.00" y="402.00" text-anchor="middle">One straight, uniform BEAM2 element per case; tolerance 1e−12.</text>
</svg>
